[package]
name = "diskmap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Windows disk-usage treemap app built on Tauri."
build = "build.rs"

[dependencies]
diskmap-core.workspace = true
diskmap-scan.workspace = true
crossbeam-channel.workspace = true
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rfd = "0.15"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
windows = { workspace = true, features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tempfile.workspace = true
