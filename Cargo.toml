[workspace]
resolver = "3"
members = ["crates/core", "crates/scan", "crates/bench", "crates/desktop"]
default-members = ["crates/core", "crates/scan", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/paul-charp/Disk-Map"
rust-version = "1.90"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[workspace.dependencies]
diskmap-core = { path = "crates/core" }
diskmap-scan = { path = "crates/scan" }
crossbeam-channel = "0.5.17"
rayon = "1.12.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }
tempfile = "3.27.0"
